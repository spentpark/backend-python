# --- Identificación del Proyecto ---
sonar.projectKey=backend-python
sonar.projectName=backend-python
# La versión se puede pasar por línea de comandos en Jenkins o definirla aquí
sonar.projectVersion=1.0.0

# --- Configuración de Rutas ---
# Definimos 'app' como la carpeta de código fuente
sonar.sources=app
# Definimos 'tests' como la carpeta de pruebas
sonar.tests=tests
# Codificación de los archivos
sonar.sourceEncoding=UTF-8

# --- Inclusiones y Exclusiones ---
# Solo analizar archivos Python
sonar.language=python
sonar.python.version=3.13

# Excluir el entorno virtual y carpetas de caché del análisis
sonar.exclusions=venv/**, .pytest_cache/**, dist/**, build/**, *.egg-info/**
# Indicar qué archivos son específicamente de tests
sonar.test.inclusions=tests/test_*.py, tests/**/test_*.py

# --- Reportes de Cobertura (CRÍTICO) ---
# Ruta al archivo XML generado por pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# --- Reportes de Linter (Opcional pero recomendado) ---
# Si decides usar Flake8 o Pylint, puedes añadir sus reportes aquí
# sonar.python.flake8.reportPaths=flake8-report.txt

# --- Configuración de Duplicados ---
# Ignorar duplicados en los tests
sonar.cpd.exclusions=tests/**