[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-python"
version = "1.0.0" # Se sobreescribe en el pipeline
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.3",
    "aiomysql>=0.3.2",
    "python-dotenv>=1.2.4",
    "cryptography>=50.0.2",
    "pydantic>=2.13.5"
]
