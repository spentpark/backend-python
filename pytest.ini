[pytest]
asyncio_mode = auto

# Reporte JUnit XML con el resultado de los tests unitarios.
# Jenkins lo publica con el step `junit` y SonarQube lo consume mediante
# `sonar.python.xunit.reportPath`. El directorio `reports/` está versionado
# con un `.gitkeep` para que pytest pueda escribir el archivo.
addopts = --junitxml=reports/junit.xml
junit_family = xunit2
